<!DOCTYPE html>
<html>
<head>
<title>Disaster Copilot</title>
<link rel="stylesheet" href="/lib/leaflet.css">
<script src="/lib/leaflet.js"></script>
<style>#map{height:400px;background:#dfe8ee} body{font-family:sans-serif;margin:10px}</style>
</head>
<body>
<h2>Disaster Response Copilot</h2>
<div id="map"></div>
<p id="loc">Click the map to set location</p>
<textarea id="text" rows="3" style="width:100%"></textarea>
<input type="file" id="photo" accept="image/*">
<button onclick="send()">Submit report</button>
<button onclick="resetAll()">Clear all reports</button>
<h3>Priority list</h3>
<ol id="list"></ol>
<script>
const map = L.map('map').setView([13.0827, 80.2707], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let pos = null, markers = [];
map.on('click', e => {
  pos = e.latlng;
  document.getElementById('loc').innerText =
    `Location: ${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)}`;
});
function toBase64(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.readAsDataURL(file);
  });
}
async function send() {
  if (!pos) return alert('Click the map first');
  const text = document.getElementById('text').value;
  const file = document.getElementById('photo').files[0];
  let image = null;
  if (file) image = await toBase64(file);
  await fetch('/report', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text, lat: pos.lat, lng: pos.lng, image})
  });
  document.getElementById('text').value = '';
  document.getElementById('photo').value = '';
  load();
}
async function load() {
  const data = await (await fetch('/reports')).json();
  markers.forEach(m => m.remove()); markers = [];
  const list = document.getElementById('list'); list.innerHTML = '';
  data.forEach(r => {
    const color = r.urgency >= 4 ? 'red' : r.urgency >= 3 ? 'orange' : 'green';
    markers.push(L.circleMarker([r.lat, r.lng], {color, radius: 10})
      .addTo(map).bindPopup(r.summary));
    list.innerHTML += `<li><b>${r.problem_type}</b> (urgency ${r.urgency},
      people ${r.people_affected}): ${r.summary}</li>`;
  });
}
async function resetAll() {
  await fetch('/reset', {method: 'POST'});
  load();
}
load();
</script>
</body>
</html>
